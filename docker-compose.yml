# MCP server — one-command run.
#   cp .env.example .env   &&   edit   &&   docker compose up --build
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mcp}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcp}"]
      interval: 5s
      timeout: 3s
      retries: 10
  mcp-server:
    build: {context: ., dockerfile: Dockerfile}
    env_file: [.env]
    environment:
      MCP_DATABASE_URL: postgresql://${POSTGRES_USER:-mcp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mcp}
    ports: ["${MCP_PORT:-8100}:8100"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  pgdata:
